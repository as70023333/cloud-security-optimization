name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (no third-party dependencies)
        run: python -m pip install .
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Demo reviews (offline, installed package)
        run: |
          cd "$RUNNER_TEMP"
          secopt sentinel --demo
          secopt licenses --demo
          secopt overlap --demo
          secopt overlap "$GITHUB_WORKSPACE/examples/security-stack.toml" --quiet
      - uses: actions/upload-artifact@v4
        with:
          name: demo-reports
          path: ${{ runner.temp }}/reports/
