# Security tool inventory for a fictional company. Copy this file and describe your own stack.
#
#   name          what you call the tool
#   vendor        who you buy it from
#   annual_cost   what you pay for it on its own each year; leave out (or 0) if it comes with a licence
#   bundled_with  the licence that includes it, when it has no separate cost
#   capabilities  what it does, from the vocabulary in: secopt overlap --list-capabilities
#
# The gap analysis checks a baseline of capabilities most organizations need. Adjust it here:
currency = "USD"
required = ["pam"]        # needed in addition to the baseline
not_required = []         # baseline capabilities that do not apply to you

